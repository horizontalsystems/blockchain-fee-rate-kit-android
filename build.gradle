// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.8.20' // Updated Kotlin version
    repositories {
        google()
        mavenCentral() // Add mavenCentral() for newer Kotlin versions
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2' // Updated AGP
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" // Uses new Kotlin version
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral() // Add mavenCentral() here as well
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
